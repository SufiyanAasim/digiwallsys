<svg xmlns="http://www.w3.org/2000/svg" width="760" height="164" viewBox="0 0 760 164" role="img" aria-labelledby="title description">
  <title id="title">digiwallsys</title>
  <desc id="description">Lowercase digiwallsys wordmark in the mint-to-cyan Aurora Glass theme.</desc>
  <defs>
    <linearGradient id="auroraWordmark" x1="4%" y1="20%" x2="96%" y2="82%">
      <stop offset="0%" stop-color="#31D1A7"/>
      <stop offset="52%" stop-color="#20B8B3"/>
      <stop offset="100%" stop-color="#2CA7D3"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8F8F4" stop-opacity=".66"/>
      <stop offset="48%" stop-color="#E8F8F4" stop-opacity=".10"/>
      <stop offset="78%" stop-color="#E8F8F4" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-30%" width="120%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#2CA7D3" flood-opacity=".34"/>
    </filter>
  </defs>
  <text x="20" y="119" fill="url(#auroraWordmark)" stroke="#D8FFF5" stroke-opacity=".30" stroke-width="1.3"
        font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="126" font-weight="800" letter-spacing="-6" filter="url(#glow)">digiwallsys</text>
  <text x="20" y="119" fill="url(#shine)"
        font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="126" font-weight="800" letter-spacing="-6">digiwallsys</text>
</svg>
