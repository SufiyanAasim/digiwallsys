name: Analytics

on:
  pull_request:
    paths:
      - analytics/**
  push:
    branches: [main, backend, frontend, database]
    paths:
      - analytics/**

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analytics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: analytics/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -v
