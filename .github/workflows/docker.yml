name: Docker

on:
  pull_request:
    paths:
      - Dockerfile
      - docker-compose.yml
      - src/backend/**
      - config/**
  push:
    branches: [main, backend, frontend, database]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: digiwallsys-api:ci
