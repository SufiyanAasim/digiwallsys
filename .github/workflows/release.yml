name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact signed tag selected for this run, for example v1.8.0
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Resolve exact release name and status
        id: release
        env:
          VERSION: ${{ inputs.version }}
        run: |
          case "$VERSION" in
            v1.0.0) NAME="Anchor"; PRERELEASE="true" ;;
            v1.0.5) NAME="Drift"; PRERELEASE="false" ;;
            v1.1.0) NAME="Current"; PRERELEASE="false" ;;
            v1.1.5) NAME="Swell"; PRERELEASE="false" ;;
            v1.2.0) NAME="Passage"; PRERELEASE="false" ;;
            v1.2.5) NAME="Gale"; PRERELEASE="false" ;;
            v1.3.0) NAME="Harbor"; PRERELEASE="false" ;;
            v1.3.5) NAME="Shoal"; PRERELEASE="false" ;;
            v1.4.0) NAME="Voyage"; PRERELEASE="false" ;;
            v1.4.5) NAME="Trade"; PRERELEASE="false" ;;
            v1.5.0) NAME="Meridian"; PRERELEASE="false" ;;
            v1.5.5) NAME="Armada"; PRERELEASE="false" ;;
            v1.6.0) NAME="Lantern"; PRERELEASE="false" ;;
            v1.6.5) NAME="Marina"; PRERELEASE="false" ;;
            v1.7.0) NAME="Compass"; PRERELEASE="false" ;;
            v1.7.5) NAME="Convoy"; PRERELEASE="false" ;;
            v1.8.0) NAME="Estuary"; PRERELEASE="false" ;;
            v1.8.5) NAME="Trench"; PRERELEASE="false" ;;
            *) echo "Unsupported release version: $VERSION" >&2; exit 1 ;;
          esac
          test -f "docs/releases/${VERSION}.md"
          test "$GITHUB_REF" = "refs/tags/${VERSION}" || {
            echo "Run this workflow from the exact signed tag ref: ${VERSION}" >&2
            exit 1
          }
          git rev-parse --verify "refs/tags/${VERSION}^{tag}" >/dev/null || {
            echo "${VERSION} must be an annotated tag" >&2
            exit 1
          }
          git cat-file -p "$VERSION" | grep -Eq '^-----BEGIN (SSH|PGP) SIGNATURE-----$' || {
            echo "${VERSION} must be signed before creating its GitHub Release" >&2
            exit 1
          }
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
      - name: Create exact GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          RELEASE_NAME: ${{ steps.release.outputs.name }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          ARGS=(
            gh release create "$VERSION"
            --title "$RELEASE_NAME"
            --notes-file "docs/releases/${VERSION}.md"
            --verify-tag
          )
          if [[ "$PRERELEASE" == "true" ]]; then
            ARGS+=(--prerelease)
          fi
          "${ARGS[@]}"
